<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cafe</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="font-sans">
  <header class="bg-amber-900 text-white">
    <div class="max-w-6xl mx-auto flex justify-between items-center p-4">
      <h1 class="text-2xl font-bold">☕ Café</h1>

      <nav class="space-x-6 hidden md:block">
        <a href="#" class="hover:text-amber-300">Home</a>
        <a href="#" class="hover:text-amber-300">Menu</a>
        <a href="#" class="hover:text-amber-300">About</a>
        <a href="#" class="hover:text-amber-300">Contact</a>
      </nav>

      <button class="bg-amber-600 px-4 py-2 rounded hover:bg-amber-700">
        Order Now
      </button>
    </div>
  </header>

  <!-- ===== HERO SECTION ===== -->
  <section class="bg-amber-100">
    <div class="max-w-6xl mx-auto grid md:grid-cols-2 gap-8 items-center p-8">
      
      <!-- Text -->
      <div>
        <h2 class="text-4xl font-bold text-amber-900 mb-4">
          Welcome to Our Café
        </h2>
        <p class="text-gray-700 mb-6">
          Enjoy freshly brewed coffee and homemade pastries in a cozy atmosphere.
        </p>
        <button class="bg-amber-700 text-white px-6 py-3 rounded hover:bg-amber-800">
          View Menu
        </button>
      </div>

      <!-- Image -->
      <div class="md:w-1/2 flex justify-center">
        <img src="https://images.unsplash.com/photo-1509042239860-f550ce710b93"
             alt="Coffee"
             class="rounded-lg shadow-lg ">
      </div>

    </div>
  </section>

  <!-- ===== FOOTER ===== -->
  <footer class="bg-amber-900 text-white">
    <div class="max-w-6xl mx-auto grid md:grid-cols-3 gap-6 p-8">
      
      <div>
        <h3 class="text-xl font-bold mb-2"> Cafe</h3>
        <p class="text-sm">Fresh coffee. Cozy place.</p>
      </div>

      <div>
        <h3 class="text-xl font-bold mb-2">Quick Links</h3>
        <ul class="space-y-2 text-sm">
          <li>Home</li>
          <li>Menu</li>
          <li>About</li>
        </ul>
      </div>

      <div>
        <h3 class="text-xl font-bold mb-2">Follow Us</h3>
        <p class="text-sm">Facebook | Instagram | Twitter</p>
      </div>

    </div>

    <div class="text-center text-sm bg-amber-950 p-3">
      © 2024 Café. All rights reserved.
    </div>
  </footer>

</body>
</html>
